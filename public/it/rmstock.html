<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="/it/apps/sso.js"></script><script src="/it/apps/kmr-ui.js"></script><script src="/it/company-config.js"></script>
<title>Raw Material Stock (mobile) · KMR Apps</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;--b1:#0891b2;--b2:#7c3aed;--g:#16a34a;--r:#dc2626;--a:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e8ecf8;--mut:#93a0bd;--line:#26304d}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.clogo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#130a3a;font-weight:800;font-size:14px;flex:none}.clogo img{max-width:34px;max-height:34px;object-fit:contain}.clogo[hidden]{display:none}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#0c1a3a;color:#fff}header h1{font-size:16px;margin:0}header small{opacity:.75;display:block;font-size:12px}
main{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
input.big{font-size:28px;font-weight:700;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 8px;font-weight:800;font-size:17px;cursor:pointer}
.seg button.on.in{border-color:var(--g);background:#dcfce7;color:#14532d}.seg button.on.out{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.save{width:100%;border:0;border-radius:12px;padding:16px;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(90deg,var(--b1),var(--b2));margin-top:14px;cursor:pointer}.save[disabled]{opacity:.5}
.bal{display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:8px}.bal b{font-size:22px}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:10px;background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}.pill.in{background:var(--g)}.pill.out{background:var(--r)}.pill.opening{background:#64748b}
.del{border:1px solid var(--r);color:var(--r);background:none;border-radius:8px;padding:6px 10px;font-weight:700}
.mut{color:var(--mut)}h2{font-size:15px;margin:0 0 6px}
.dsk{display:block;text-align:center;margin-top:6px;font-size:13px}a{color:var(--b1)}
</style></head><body>
<header><span class="clogo" id="clogo" hidden></span><div><h1>Raw material stock</h1><small id="co">Loading…</small></div><div style="flex:1"></div><span id="role" style="font-size:12px;opacity:.8"></span></header>
<main><div id="msg"></div>
<div class="card" id="form"></div>
<div class="card"><h2>Today’s entries</h2><div id="today" class="mut">Loading…</div></div>
<a class="dsk" id="dsk" href="#">Open the full month screen (computer)</a>
</main>
<script src="/it/apps/qp-core.js"></script>
<script>
const {$,esc,iso,say,call}=QP;
const S={mats:[],kind:'in',q:'',mat:'',can:false};
const n=(v)=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:3});
const ist=()=>new Date(Date.now()+19800000).toISOString().slice(0,10);
async function load(){const r=await call('kmr_rm_mats',{});S.mats=r.materials||[];S.can=r.can_edit;S.unit=r.unit;$('#co').textContent=(r.unit||'').replace('‑','-')+' · Raw material in / out';draw();await today()}
function cur(){return S.mats.find(m=>m.code===S.mat)}
function draw(){const m=cur(),u=m?m.unit:'kg';
  if(!S.can){$('#form').innerHTML='<p class="mut">You can view stock but not enter it. Ask your administrator for editor access.</p>';return}
  $('#form').innerHTML=`<div class="seg"><button class="in ${S.kind==='in'?'on':''}" data-k="in">⬇ Received</button><button class="out ${S.kind==='out'?'on':''}" data-k="out">⬆ Issued</button></div>
  <label>Material</label><input id="f" placeholder="Type to search material…" value="${esc(S.q)}" autocomplete="off">
  <select id="mat" size="${Math.min(6,Math.max(2,filtered().length))}" style="margin-top:6px">${filtered().map(x=>`<option value="${esc(x.code)}" ${x.code===S.mat?'selected':''}>${esc(x.code)} — ${n(x.balance)} ${esc(x.unit)}</option>`).join('')}</select>
  ${m?`<div class="bal"><span class="mut">Balance now</span><b>${n(m.balance)} ${esc(u)}</b></div>`:''}
  <label>Quantity (${esc(u)})</label><input id="qty" class="big" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
  <label>Date</label><input id="dt" type="date" value="${ist()}" max="${ist()}">
  <label>${S.kind==='in'?'GRN / challan / invoice no.':'Issue slip / job no.'} (optional)</label><input id="ref" maxlength="60">
  <label>Remarks (optional)</label><input id="rem" maxlength="200">
  <button class="save" id="go">Save ${S.kind==='in'?'received':'issued'}</button>`}
function filtered(){const q=S.q.trim().toLowerCase();return S.mats.filter(x=>!q||x.code.toLowerCase().includes(q)||(x.spec||'').toLowerCase().includes(q))}
async function today(){const t=ist(),rows=await call('kmr_rm_txns',{p_from:t,p_to:t,p_material:null});
  $('#today').innerHTML=rows.length?rows.map(x=>`<div class="row"><div><span class="pill ${x.kind}">${x.kind==='in'?'Received':x.kind==='out'?'Issued':'Opening'}</span> <b>${esc(x.material_code)}</b><br><span class="mut">${n(x.qty)} ${esc((S.mats.find(m=>m.code===x.material_code)||{}).unit||'kg')}${x.ref?' · '+esc(x.ref):''}</span></div>${S.can?`<button class="del" data-del="${x.id}">Delete</button>`:''}</div>`).join(''):'No entries yet today.'}
document.addEventListener('click',async e=>{const k=e.target.closest('[data-k]');if(k){S.kind=k.dataset.k;const keep={q:S.q,mat:S.mat};draw();return}
  const d=e.target.closest('[data-del]');if(d){if(!await KMRDlg.yes('Delete this entry? The balance will change back.'))return;try{await call('kmr_rm_delete',{p_id:d.dataset.del});say('Deleted.',true);await load()}catch(x){say(x.message)}return}
  if(e.target.id==='go'){const q=Number($('#qty').value);if(!S.mat)return say('Choose the material first.');if(!(q>0))return say('Type the quantity.');e.target.disabled=true;
    try{await call('kmr_rm_save',{p:{material_code:S.mat,kind:S.kind,qty:q,txn_date:$('#dt').value,ref:$('#ref').value,remarks:$('#rem').value}});say(`Saved: ${S.kind==='in'?'received':'issued'} ${n(q)} of ${S.mat}.`,true);S.q='';await load()}catch(x){say(x.message);e.target.disabled=false}}});
document.addEventListener('input',e=>{if(e.target.id==='f'){S.q=e.target.value;const p=e.target.selectionStart;draw();const f=$('#f');f.focus();f.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='mat'){S.mat=e.target.value;const q=$('#qty')?$('#qty').value:'';draw();if(q)$('#qty').value=q}});
$('#dsk').addEventListener('click',e=>{e.preventDefault();location.href='/it/rmp.html?co='+encodeURIComponent(QP.slug)+'#go=stock'});
(async()=>{try{await QP.init('rmp');if(!QP.ctx)return;await load()}catch(e){say(e.message)}})();
</script></body></html>
