<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d9488"><script src="/it/company-config.js"></script>
<title>My attendance and payslip</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;--b1:#0d9488;--g:#16a34a;--a:#f59e0b;--r:#dc2626;--bl:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e8ecf8;--mut:#93a0bd;--line:#26304d}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:0 16px}
header{background:#0c1a3a;color:#fff;padding:12px 0}header .wrap{display:flex;align-items:center;gap:10px}header h1{font-size:16px;margin:0}header small{display:block;opacity:.75;font-size:12px}header .sp{flex:1}
.ht{min-width:0}header h1{line-height:1.2}.who{font-size:12px;text-align:right;max-width:44%;line-height:1.3}.who b{display:block;font-size:13px;overflow-wrap:anywhere}.who span{display:block;opacity:.85}
.clogo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#130a3a;font-weight:800;font-size:14px;flex:none}.clogo img{max-width:34px;max-height:34px;object-fit:contain}.clogo[hidden]{display:none}.clogo.big{width:64px;height:64px;margin:0 auto;border:1px solid var(--line);font-size:20px}.clogo.big img{max-width:56px;max-height:56px}
.rec{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.rec:last-child{border-bottom:0}.rec span{color:var(--mut);font-size:13px}.rec b{text-align:right;overflow-wrap:anywhere;font-size:14px}
main{flex:1;padding:14px 0 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea,button{font:inherit;font-size:16px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{display:inline-block;border:0;background:var(--b1);color:#fff;font-weight:700;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:44px}.btn.o{background:none;color:var(--b1);border:1px solid var(--b1)}.btn.r{background:var(--r)}.btn.s{padding:7px 12px;min-height:36px;font-size:14px}.btn.w{width:100%}.btn:disabled{opacity:.55}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}.ok{background:#dcfce7;color:#166534;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}.kv span{display:block;color:var(--mut);font-size:12px}.kv b{font-size:16px}
.big{font-size:28px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.s-P{background:#dcfce7;color:#166534}.s-HD{background:#fef9c3;color:#854d0e}.s-A{background:#fee2e2;color:#991b1b}.s-L{background:#dbeafe;color:#1e40af}.s-U{background:#ffedd5;color:#9a3412}.s-WO{background:#e2e8f0;color:#334155}.s-H{background:#ede9fe;color:#5b21b6}.s-MP{background:#fef3c7;color:#92400e}
.a{background:#fef3c7;color:#92400e}.g{background:#dcfce7;color:#166534}.x{background:#e2e8f0;color:#334155}.rr{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
.day{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.day .d{width:44px;flex:none;text-align:center;line-height:1.1}.day .d b{font-size:18px;display:block}.day .d span{font-size:11px;color:var(--mut)}.day .i{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav .wrap{display:flex;padding:0}nav button{flex:1;background:none;border:0;padding:10px 2px 8px;color:var(--mut);font-size:12px;font-weight:700;min-height:56px}nav button b{display:block;font-size:20px;line-height:1.1}nav button.on{color:var(--b1)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 16px 76px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
.hide{display:none!important}
@media print{header,nav,footer,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style></head><body>
<header><div class="wrap"><span class="clogo" id="clogo" hidden></span><div class="ht"><h1 id="co">My attendance and payslip</h1><small>Employee self service</small></div><div class="sp"></div><div class="who" id="who"></div></div></header>
<main><div class="wrap"><div id="msg"></div>
<section id="login" class="card hide"><h2>Sign in</h2><div class="mut">Enter your employee ID and your date of birth. You will see only your own attendance and salary.</div>
<form id="lf" autocomplete="off"><label for="lc">Employee ID</label><input id="lc" autocapitalize="characters" autocomplete="username" placeholder="for example E-0001" required>
<label for="ld">Date of birth</label><input id="ld" type="date" autocomplete="bday" required>
<div style="margin-top:14px"><button class="btn w" id="lgo" type="submit">Sign in</button></div></form></section>
<section id="v-home" class="hide"></section><section id="v-att" class="hide"></section><section id="v-pay" class="hide"></section><section id="v-apply" class="hide"></section><section id="v-me" class="hide"></section>
</div></main>
<nav id="nav" class="hide"><div class="wrap"><button data-v="home" class="on"><b>🏠</b>Home</button><button data-v="att"><b>🗓</b>Attendance</button><button data-v="pay"><b>💰</b>Payslips</button><button data-v="apply"><b>✍️</b>Leave</button><button data-v="me"><b>👤</b>Profile</button></div></nav>
<footer>Powered By : KMR Group of Companies</footer>
<script src="/it/apps/hrm-calc.js"></script><script>if(new URLSearchParams(location.search).has("demo")){document.write('<script src="/it/apps/hrm-demo.js"><\/script>')}</script>
<script src="/it/apps/kmr-report.js"></script><script src="/it/apps/hrm-me.js"></script></body></html>
