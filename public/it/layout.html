<script>
/* ENGINE — pure functions, no screen access. Units: metres. y grows downwards (north = 0). */
const TYPES = {
  cnc:    { n: 'CNC turning (Computer Numerical Control lathe)', s: 'CNC turning', c: '#2563eb', o: 1 },
  vmc:    { n: 'Machining centre (vertical / horizontal)', s: 'Machining centre', c: '#7c3aed', o: 2 },
  conv:   { n: 'Conventional machine', s: 'Conventional', c: '#d97706', o: 3 },
  msa:    { n: 'Quality / measurement table', s: 'Quality table', c: '#059669', o: 4 },
  finish: { n: 'Finishing, assembly and packing', s: 'Finish & pack', c: '#db2777', o: 5 },
  office: { n: 'Office room', s: 'Office room', c: '#0891b2', o: 6 }
};
const KINDS = {
  public:  { n: 'Public (visitors, meetings)', c: '#0284c7' },
  open:    { n: 'Open workspace', c: '#0891b2' },
  private: { n: 'Private cabin', c: '#7c3aed' },
  service: { n: 'Service (pantry, restrooms, server)', c: '#64748b' }
};
const FACTORY_CONCEPTS = [
  { key: 'cellular-u',     name: 'Option A: Dual U-cells (lean group technology)', short: 'U-cells' },
  { key: 'cellular-heavy', name: 'Option B: Heavy machines on the walls + central island', short: 'Heavy perimeter' },
  { key: 'straight-flow',  name: 'Option C: Straight one-piece flow, north to south', short: 'Straight flow' },
  { key: 'functional',     name: 'Option D: Departments by machine type (functional layout)', short: 'Departments' }
];
const ASIS_CONCEPT = { key: 'as-is', name: 'Your current layout (as read from the uploaded plan)', short: 'Current layout' };
const OFFICE_VARIANTS = [
  { key: 'office-ergonomic', name: 'Option A: Visitors at the entrance, quiet cabins at the back', short: 'Public first', order: ['public', 'service', 'open', 'private'] },
  { key: 'office-ergonomic', name: 'Option B: Visitors and cabins together, open floor at the back', short: 'Cabins near entrance', order: ['public', 'private', 'service', 'open'] },
  { key: 'office-ergonomic', name: 'Option C: Open floor at the entrance, services beside it', short: 'Open floor first', order: ['open', 'service', 'public', 'private'] }
];
const DEFAULT_DIM = { width: 20, depth: 30, hallDepth: 24, qcDepth: 5.4, aisle: 2.8, opClearance: 1.2, maintClearance: 1.5 };
const TARGETS = { saving: 15, utilMin: 40, utilMax: 70, aisle: 2.8, op: 1.2, maint: 1.5 };
const WALL = 0.5, GAP = 0.3, AISLE_SIDE = 0.3;

const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : d; };
const area = m => m.w * m.h;
const manhattan = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);

/* Shelf-pack items in rows across one or more x-segments. Rotates an item by 90 degrees when that is the only way it fits. */
function packRows(items, segs, y0, yMax, gx, rowGap) {
  const placed = [], noFit = [];
  let y = y0, i = 0;
  const bw = Math.max(...segs.map(s => s[1] - s[0]));
  const queue = items.map(m => {
    let w = m.w, h = m.h, rot = false;
    if (w > bw + 1e-9 && h <= bw + 1e-9) { const t = w; w = h; h = t; rot = true; }

/* ---------- existing plan: read DXF / PDF / picture ---------- */
function impK() {
  if (!IM || !IM.raw) return 1;
  let k = IM.src === 'dxf' ? UNIT_M[IM.unit] : (25.4 / 72 / 1000) * IM.scale;
  return k;
}
function reinterp() {
  if (!IM || !IM.raw || IM.src === 'img') return;
  let k = impK(), res = interpret(IM.raw, k);
  if (IM.realW > 0 && res.building && res.building.w > 0) { k *= IM.realW / res.building.w; res = interpret(IM.raw, k); }
  IM.res = res; IM.k = k;
}
async function onPlanFile(f) {
  if (!f) return; const ext = (f.name.split('.').pop() || '').toLowerCase();

  IM = { name: f.name, src: '', raw: null, unit: 'mm', scale: 100, realW: 0, res: null, busy: true }; paintImp(); say('');
  try {
    if (ext === 'dxf') { const txt = await f.text(), d = parseDXF(txt); IM.raw = rectsFromDXF(d); IM.src = 'dxf'; IM.unit = unitGuess(IM.raw, d.insunits); if (IM.raw.oblique) IM.warn = IM.raw.oblique + ' item(s) drawn at an angle were not read.'; }
    else if (ext === 'pdf') { IM.raw = await readPDF(await f.arrayBuffer()); IM.src = 'pdf'; IM.underlay = IM.raw.underlay; IM.page = [IM.raw.pageW, IM.raw.pageH]; const ext2 = IM.raw.rects.length ? Math.max(...IM.raw.rects.map(r => r.x1 - r.x0)) : 0; const sc = [20, 25, 50, 75, 100, 150, 200, 250, 500].find(s => { const m = ext2 * 25.4 / 72 / 1000 * s; return m >= 12 && m <= 150; }); IM.scale = sc || 100; if (IM.raw.mpp) { IM.scale = Math.round(IM.raw.mpp / (25.4 / 72 / 1000) * 100) / 100; IM.calib = true; } }
    else if (/^(jpe?g|png|webp|gif|bmp)$/.test(ext)) { IM.raw = await readImage(f); IM.src = 'img'; IM.underlay = IM.raw.underlay; IM.page = [IM.raw.pageW, IM.raw.pageH]; TR = { mode: 'scale', pts: [], pxm: 0, bld: null, boxes: [] }; }
    else throw new Error('Upload a DXF, PDF, JPG or PNG file.');
    IM.busy = false; reinterp(); if (IM.res && IM.res.items) IM.matched = applyMaster(IM.res.items);
    if (IM.src !== 'img' && (!IM.res || !IM.res.building || IM.res.items.length < 2)) { say('Few or no machines could be read from this file. For a scanned plan or a drawing without box shapes, trace the machines by hand below.'); IM.src = IM.src === 'dxf' ? 'dxf' : IM.src; if (IM.underlay) TR = { mode: 'scale', pts: [], pxm: 0, bld: null, boxes: [] }; }
  } catch (err) { IM = null; say(err.message); }
  paintImp();
}
