<style>

</style></head><body>
<header><div><h1>Calibration Hub</h1><small id="co">Loading…</small></div><div style="flex:1"></div><span class="chip x" id="role"></span></header>
<div class="tabs"><button class="tab on" data-t="dash">Dashboard</button><button class="tab" data-t="inst">Instruments</button><button class="tab" data-t="oot">OOT cases</button><button class="tab" data-t="std">Standards alignment</button></div>
<main><div class="panel"><div id="msg"></div><section id="dash"></section><section id="inst" class="hide"></section><section id="oot" class="hide"></section><section id="std" class="hide"></section></div></main>
<div class="modal" id="m"><div class="in" id="mb"></div></div>
<a class="back hide" id="back" href="#">← <span id="bco"></span> · KMR Apps</a>
<script>
const CFG={SUPABASE_URL:'https://dehlcusptkzfhqvpfyjh.supabase.co',DUE_DAYS:30,TYPES:['Vernier caliper','Micrometer','Dial gauge','Height gauge','Bore gauge','Plug gauge','Pin gauge','Ring gauge','Thread gauge','Torque wrench','Pressure gauge','Thermometer','Balance','Other'],STATUS:['In use','Quarantine','Out of service','Scrapped','Lost']};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs=new URLSearchParams(location.search),DEMO=qs.has('demo');let slug=(qs.get('co')||'').toLowerCase(),sb,ctx,D={instruments:[],records:[],events:[],oot:[]},canEdit=false;
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5),dmy=d=>d?d.split('-').reverse().join('-'):'—';

function st(i){if(i.status!=='In use')return[i.status,'x'];if(!i.next_due)return['No calibration','a'];const d=dd(i.next_due,today());return d<0?['Overdue','r']:d<=CFG.DUE_DAYS?['Due soon','a']:['Valid','g']}

function dash(){const I=D.instruments,use=I.filter(i=>i.status==='In use'),S=i=>st(i)[0],od=use.filter(i=>S(i)==='Overdue'),soon=use.filter(i=>S(i)==='Due soon'),ok=use.length?Math.round((use.length-od.length)/use.length*100):100,oo=D.oot.filter(o=>o.status!=='Closed');

$('#dash').innerHTML=I.length?`<div class="kpis">${k(I.length,'Instruments','var(--b2)')}${k(ok+'%','Calibrated on time',ok>=95?'var(--g)':'var(--r)')}${k(od.length,'Overdue','var(--r)')}${k(soon.length,'Due in '+CFG.DUE_DAYS+' days','var(--a)')}${k(oo.length,'Open OOT cases',oo.length?'var(--r)':'var(--g)')}${k(I.filter(i=>i.status==='Quarantine').length,'Quarantined','var(--a)')}</div><h3>Overdue &amp; due soon</h3>${L?`<table><thead><tr><th>Instrument</th><th>Dept</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody>${L}</tbody></table>`:'<p class="mut">Nothing due. ✔</p>'}`:'<p class="mut">No instruments yet. Open <b>Instruments</b> and press <b>＋ Add instrument</b>.</p>'}

['IATF 16949:2016','7.1.5.1.1 Measurement systems analysis','MSA (GRR, bias, linearity, stability) — planned module, not in this version.',()=>'Not yet available'],
['VDA 6.3','Test equipment suitability and status (process audit)','Status, history card and audit evidence can be shown on screen or printed per gauge.',()=>`${D.records.length} calibration records`]];
function std(){$('#std').innerHTML=`<p class="mut">How this app supports each requirement, with live evidence from your data. The auditor decides compliance; clause wording should be checked against your copy of each standard.</p><table><thead><tr><th>Standard</th><th>Requirement</th><th>How the app meets it</th><th>Live evidence</th></tr></thead><tbody>${STD.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${esc(r[3]())}</b></td></tr>`).join('')}</tbody></table>`}
const F=(id,l,v,t='text',o)=>`<div><label>${l}</label>${o?`<select id="${id}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="${id}" type="${t}" value="${esc(v??'')}">`}</div>`,V=id=>$('#'+id).value.trim();
const open=h=>{$('#mb').innerHTML=h;$('#m').classList.add('on')},close=()=>$('#m').classList.remove('on');
function iform(i){i=i||{};open(`<h3>${i.id?'Edit':'Add'} instrument</h3><div class="frm">${F('f_tag','Tag / ID *',i.tag)}${F('f_name','Description *',i.name)}${F('f_itype','Type',i.itype,'text',CFG.TYPES)}${F('f_make','Make',i.make)}${F('f_model','Model',i.model)}${F('f_serial_no','Serial no.',i.serial_no)}${F('f_range_text','Range',i.range_text)}${F('f_least_count','Least count',i.least_count)}${F('f_tolerance','Tolerance',i.tolerance)}${F('f_department','Department',i.department)}${F('f_location','Location',i.location)}${F('f_custodian','Custodian',i.custodian)}${F('f_criticality','Criticality',i.criticality||'Major','text',['Critical','Major','Minor'])}${F('f_cal_source','Calibrated',i.cal_source||'External','text',['Internal','External'])}${F('f_lab','Lab',i.lab)}${F('f_freq_months','Frequency (months)',i.freq_months||12,'number')}${F('f_status','Status',i.status||'In use','text',CFG.STATUS)}</div><div class="row" style="margin-top:12px"><button class="btn" data-sv="${i.id||''}">Save</button><button class="btn o" data-x>Cancel</button></div>`)}
function cform(i){open(`<h3>Calibrate ${esc(i.tag)} · ${esc(i.name)}</h3><div class="frm">${F('c_date','Calibration date *',today(),'date')}${F('c_kind','Kind',i.cal_source,'text',['Internal','External'])}${F('c_lab','Lab',i.lab)}${F('c_acc','Accreditation (e.g. NABL)','')}${F('c_cert','Certificate no.','')}${F('c_af','As-found within tolerance?','Yes','text',['Yes','No','Not known'])}${F('c_res','Result','Pass','text',['Pass','Fail'])}${F('c_err','Max error','')}${F('c_unc','Uncertainty','')}${F('c_t','Temp °C','','number')}${F('c_h','Humidity %','','number')}${F('c_by','Calibrator','')}${F('c_next','Next due (blank = automatic)','','date')}</div><div style="margin-top:8px"><label class="mut">Remarks</label><textarea id="c_rem" rows="2"></textarea></div><div class="row" style="margin-top:12px"><button class="btn" data-sc="${i.id}">Save calibration</button><button class="btn o" data-x>Cancel</button></div>`)}
function hist(id){const i=D.instruments.find(x=>x.id===id),R=D.records.filter(r=>r.instrument_id===id),E=D.events.filter(e=>e.instrument_id===id),O=D.oot.filter(o=>o.instrument_id===id);
const T=[...R.map(r=>({d:r.cal_date,h:`<b>Calibration</b> · ${esc(r.result)} · ${esc(r.kind||'')} ${esc(r.lab||'')}<br><span class="mut">Cert ${esc(r.cert_no||'—')} ${esc(r.accreditation||'')} · max error ${esc(r.max_error||'—')} · uncertainty ${esc(r.uncertainty||'—')} · as-found ${r.as_found_ok===false?'<b style="color:var(--r)">OUT of tolerance</b>':r.as_found_ok?'OK':'n/a'} · next due ${dmy(r.next_due)} · ${esc(r.calibrator||'')}</span>`})),...E.map(e=>({d:e.ev_date,h:`<b>${esc(e.ev_type)}</b> · ${esc(e.detail||'')}<br><span class="mut">${esc(e.by_email||'')}</span>`})),...O.map(o=>({d:o.opened_at,h:`<b style="color:var(--r)">OOT case</b> · ${esc(o.status)} · ${esc(o.summary||'')}`}))].sort((a,b)=>b.d.localeCompare(a.d));
const pts=R.filter(r=>!isNaN(parseFloat(r.max_error))).sort((a,b)=>a.cal_date.localeCompare(b.cal_date)),mx=Math.max(...pts.map(r=>Math.abs(parseFloat(r.max_error))),parseFloat(i.tolerance)||0,1e-9),W=520,H=110,X=k=>20+k*(W-40)/Math.max(pts.length-1,1),Y=v=>H-14-Math.abs(v)/mx*(H-30);
const chart=pts.length>1?`<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${pts.map((r,k)=>(k?'L':'M')+X(k)+' '+Y(parseFloat(r.max_error))).join(' ')}" fill="none" stroke="var(--b2)" stroke-width="2.5"/>${parseFloat(i.tolerance)?`<line x1="20" x2="${W-20}" y1="${Y(parseFloat(i.tolerance))}" y2="${Y(parseFloat(i.tolerance))}" stroke="var(--r)" stroke-dasharray="5 4"/>`:''}${pts.map((r,k)=>`<circle cx="${X(k)}" cy="${Y(parseFloat(r.max_error))}" r="3.5" fill="var(--b2)"><title>${r.cal_date}: ${r.max_error}</title></circle>`).join('')}</svg><div class="mut" style="font-size:12px">Drift: max error per calibration (dashed = tolerance ${esc(i.tolerance)})</div>`:'<p class="mut">Drift chart appears after two calibrations with a numeric max error.</p>';
const cost=R.length,oo=O.length;
open(`<div id="hist"><h2 style="margin:0">Gauge history card · ${esc(i.tag)}</h2><p>${chip(i)} <b>${esc(i.name)}</b> · ${esc(i.make||'')} ${esc(i.model||'')} · S/N ${esc(i.serial_no||'—')} · range ${esc(i.range_text||'—')} · least count ${esc(i.least_count||'—')} · tolerance ${esc(i.tolerance||'—')}</p><p class="mut">${esc(i.department||'')} · ${esc(i.location||'')} · custodian ${esc(i.custodian||'—')} · ${esc(i.cal_source)} ${esc(i.lab||'')} · every ${i.freq_months} months · criticality ${esc(i.criticality)} · last ${dmy(i.last_cal)} · next ${dmy(i.next_due)}</p><div class="kpis"><div class="kpi"><b>${cost}</b><span>Calibrations</span></div><div class="kpi" style="--c:var(--r)"><b>${oo}</b><span>OOT cases</span></div></div>${chart}<h3>History</h3><div class="tl">${T.map(t=>`<div><span class="mut">${dmy(t.d)}</span><br>${t.h}</div>`).join('')||'<p class="mut">No history yet.</p>'}</div></div><div class="row noprint" style="margin-top:10px"><button class="btn" onclick="window.print()">Print card</button>${canEdit?['Repair','Damage report','Issued','Returned'].map(x=>`<button class="btn o sm" data-ev="${id}|${x}">${x}</button>`).join(''):''}<button class="btn o" data-x>Close</button></div>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('button'),t=e.target.closest('.tab');if(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));['dash','inst','oot','std'].forEach(s=>$('#'+s).classList.toggle('hide',s!==t.dataset.t));return}if(!b)return;const I=id=>D.instruments.find(x=>x.id===id);
try{if(b.id==='add')iform();else if(b.dataset.e)iform(I(b.dataset.e));else if(b.dataset.c)cform(I(b.dataset.c));else if(b.dataset.h)hist(b.dataset.h);else if('x'in b.dataset)close();
else if('sv'in b.dataset){const p={id:b.dataset.sv||undefined};['tag','name','itype','make','model','serial_no','range_text','least_count','tolerance','department','location','custodian','criticality','cal_source','lab','freq_months','status'].forEach(k=>p[k]=V('f_'+k));await api.rpc('kmr_cal_save_instrument',{p_slug:slug,p});close();await load();say('Instrument saved.',true)}
else if('sc'in b.dataset){const af=V('c_af'),p={instrument_id:b.dataset.sc,cal_date:V('c_date'),kind:V('c_kind'),lab:V('c_lab'),accreditation:V('c_acc'),cert_no:V('c_cert'),as_found_ok:af==='Yes'?'true':af==='No'?'false':'',result:V('c_res'),max_error:V('c_err'),uncertainty:V('c_unc'),temp_c:V('c_t'),humidity:V('c_h'),calibrator:V('c_by'),next_due:V('c_next'),remarks:V('c_rem')};await api.rpc('kmr_cal_save_record',{p_slug:slug,p});close();await load();say(af==='No'?'Saved. An out-of-tolerance case was opened — assess affected product.':'Calibration saved.',true)}
else if(b.dataset.ev){const[id,ty]=b.dataset.ev.split('|'),d=prompt(ty+' — details:');if(d===null)return;await api.rpc('kmr_cal_event',{p_slug:slug,p:{instrument_id:id,ev_type:ty,detail:d}});await load();hist(id)}
else if(b.dataset.o){const a=prompt('Assessment of product measured since the last good calibration, customer notification and action taken:');if(a===null)return;const c=confirm('Close this case? (OK = close, Cancel = keep under investigation)');await api.rpc('kmr_cal_close_oot',{p_slug:slug,p_id:b.dataset.o,p:{action:a,status:c?'Closed':'Under investigation',notify:''}});await load()}}catch(err){say(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim().toLowerCase();pi()}});
const isPub=k=>{if(k.startsWith('sb_publishable_'))return true;try{return JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon'}catch{return false}};
async function findKey(){const c=sessionStorage.getItem('kmr_pub_key');if(c)return c;for(const pg of['/it/sales.html','/it/capacity.html','/it/balloon.html','/it/pd.html']){try{const h=await(await fetch(pg)).text(),k=(h.match(/sb_publishable_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}/g)||[]).find(isPub);if(k){sessionStorage.setItem('kmr_pub_key',k);return k}}catch{}}throw new Error('Could not find the KMR public key on this website.')}
