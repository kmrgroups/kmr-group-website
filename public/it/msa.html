<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="/it/apps/sso.js"></script><script src="/it/apps/kmr-ui.js"></script><script src="/it/apps/standards.js"></script><script src="/it/company-config.js"></script>
<title>MSA Studies · KMR Apps</title>
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;--b1:#0f766e;--b2:#0891b2;--g:#16a34a;--a:#f59e0b;--r:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e8ecf8;--mut:#93a0bd;--line:#26304d}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
.clogo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#130a3a;font-weight:800;font-size:14px;flex:none}.clogo img{max-width:34px;max-height:34px;object-fit:contain}.clogo[hidden]{display:none}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1e1b4b;color:#fff;flex-wrap:nowrap;position:sticky;top:0;z-index:7}header>div:first-of-type{min-width:0}header small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#role{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header h1{font-size:17px;margin:0}header small{opacity:.75;display:block}
.bell{position:relative;border:0;background:#ffffff22;color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}.bell b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--r);font-size:11px;display:grid;place-items:center;padding:0 4px}.bell b:empty,.bell b[hidden]{display:none}
.tabs{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{text-decoration:none;display:inline-block;padding:9px 14px;font-weight:600;color:var(--mut);border-radius:10px 10px 0 0;white-space:nowrap;flex:none}.tab.on{background:var(--card);color:var(--b1);box-shadow:0 -2px 0 var(--b1) inset}
main{padding:0 14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px;min-height:50vh}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%;min-width:0}textarea{resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--b1),var(--b2));cursor:pointer;text-decoration:none;display:inline-block}.btn.o{background:none;color:var(--b1);border:1px solid var(--b1)}.btn.s{padding:6px 11px;font-size:13px}.btn.r{background:var(--r)}.btn.g{background:var(--g)}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row>.grow{flex:1;min-width:150px}
.quick{display:flex;gap:8px;margin-bottom:12px}.quick input{font-size:16px;padding:12px;border:2px solid var(--b1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--c,var(--b1));cursor:pointer;background:var(--card);text-align:left}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--c,#94a3b8);white-space:nowrap}.g{--c:var(--g)}.a{--c:var(--a)}.r{--c:var(--r)}.x{--c:#94a3b8}.b{--c:var(--b1)}.v{--c:var(--b2)}
.t{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--pc,#94a3b8);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--card);cursor:pointer}.t:hover{box-shadow:0 2px 10px #0001}
.t.urgent{--pc:var(--r)}.t.high{--pc:var(--a)}.t.normal{--pc:var(--b1)}.t.low{--pc:#94a3b8}.t.fin{opacity:.6}.t.fin .tt{text-decoration:line-through}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px;padding:0;margin-top:1px}.ck.on{background:var(--g);border-color:var(--g)}
.tb{flex:1;min-width:0}.tt{font-weight:700;word-break:break-word}.tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center;font-size:12.5px;color:var(--mut)}
.late{color:var(--r);font-weight:700}.today{color:var(--a);font-weight:700}
.empty{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);line-height:1.7}
.guide{background:var(--bg);border-left:4px solid var(--b1);padding:8px 12px;border-radius:8px;margin:0 0 12px;color:var(--mut);font-size:13.5px}
.mut{color:var(--mut)}.hide{display:none!important}.msg{padding:9px 12px;border-radius:10px;margin-bottom:10px;background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
.fab{position:fixed;right:16px;bottom:48px;z-index:8;border:0;border-radius:99px;padding:14px 22px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--b1),var(--b2));box-shadow:0 6px 20px #0f766e66;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:9000;padding:10px;overflow:auto}.modal.on{display:flex}.in{background:var(--card);border-radius:16px;width:min(720px,100%);padding:16px;margin:auto}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.frm .w{grid-column:1/-1}.frm label,.lbl{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-weight:700;cursor:pointer}.seg button.on{border-color:var(--b1);background:var(--b1);color:#fff}
.cl{display:flex;gap:8px;align-items:center;padding:5px 0}.cl input[type=checkbox]{width:20px;height:20px;flex:none}.cl.d span{text-decoration:line-through;color:var(--mut)}
.th{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.cm{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.cm.ev{color:var(--mut);font-size:12.5px;font-style:italic}.cm small{color:var(--mut)}
.bars .bl{display:grid;grid-template-columns:minmax(80px,140px) 1fr 70px;gap:8px;align-items:center;margin:6px 0;cursor:pointer}.bars i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--b1),var(--b2))}.bars i.r{background:var(--r)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:15px}
.trend{display:flex;align-items:flex-end;gap:4px;height:90px}.trend div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;height:100%}.trend i{width:100%;border-radius:3px 3px 0 0;background:var(--b1);min-height:1px}.trend i.d{background:var(--g)}.trend small{font-size:9px;color:var(--mut)}
.nt{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.nt.un{background:#0f766e14}.nt b{display:block}.nt small{color:var(--mut)}
.pillw{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px}
@media(max-width:600px){.panel{padding:12px}.fab{right:12px}}
.svgw{width:100%;overflow:visible}.svgw text{fill:var(--mut);font:11px system-ui}.cc{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px;background:var(--card)}.cc h4{margin:2px 6px 4px;font-size:13px;color:var(--mut)}
table.tb2{width:100%;border-collapse:collapse;font-size:13.5px}table.tb2 th{text-align:left;color:var(--mut);font-size:11.5px;text-transform:uppercase;padding:6px;border-bottom:1px solid var(--line)}table.tb2 td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}.sc{overflow-x:auto}
.gtab input{width:78px;padding:7px}.gtab td{padding:3px}.gtab th{padding:3px 6px;font-size:11px}.ab{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;width:100%;font-weight:700;cursor:pointer}.ab.on{background:var(--b1);color:#fff;border-color:var(--b1)}.gr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.gr input{width:84px;padding:8px}
@media print{header,.tabs,.fab,.kmr-foot,.noprint,.kmr-demo{display:none!important}body{background:#fff;padding:0}.panel{border:0;padding:0}}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.tcard{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.tcard:hover{border-color:var(--b1);box-shadow:0 2px 10px #0001}.tcard b{font-size:15px;color:var(--b1)}.tcard span{font-weight:600}.tcard small{color:var(--mut);line-height:1.35}.tcard.lk{opacity:.6}
.step{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--card)}.sh{font-weight:800;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}.sn{width:26px;height:26px;border-radius:50%;background:var(--b1);color:#fff;display:inline-grid;place-items:center;font-size:14px}
.tolbox{border:1px dashed var(--line);border-radius:10px;padding:10px;background:var(--bg)}.tolout{margin-top:8px;font-size:13.5px}h4.rt{margin:16px 0 6px;font-size:14px;border-bottom:2px solid var(--b1);padding-bottom:3px}
table.rh th{width:17%;background:var(--bg)}table.rh td{width:33%}table.sign th{background:var(--bg);width:11%}table.sign td{height:34px}.tb2 textarea{min-width:150px;font-size:13px;padding:6px}
@media print{.step.noprint,.noprint{display:none!important}.step{border:0;padding:0}.sh{font-size:17px}.cc{break-inside:avoid}h4.rt{break-after:avoid}}
.atabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.atab{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}.ah{font-weight:800;margin-bottom:6px;color:var(--b1)}.ds th,.ds td{text-align:center;font-size:12.5px}.ds td:first-child,.ds th:first-child{text-align:left}
@media(max-width:640px){table.rh,table.rh tbody,table.rh tr,table.rh th,table.rh td,table.sign,table.sign tbody,table.sign tr,table.sign th,table.sign td{display:block;width:auto!important}table.rh th,table.sign th{padding-top:8px}table.rh td{padding-bottom:6px}}
</style></head><body>
