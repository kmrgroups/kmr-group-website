<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="/it/apps/sso.js"></script><script src="/it/apps/kmr-ui.js"></script><script src="/it/apps/standards.js"></script><script src="/it/company-config.js"></script>
<title>Daily Work Management · KMR Apps</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f2;--b1:#174b80;--b2:#7c3aed;--g:#16a34a;--a:#f59e0b;--r:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e8ecf8;--mut:#93a0bd;--line:#26304d}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
.clogo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#130a3a;font-weight:800;font-size:14px;flex:none}.clogo img{max-width:34px;max-height:34px;object-fit:contain}.clogo[hidden]{display:none}
header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#0c1a3a;color:#fff;flex-wrap:wrap}header h1{font-size:17px;margin:0}header small{opacity:.7;display:block}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--c,#94a3b8)}.chip.x{background:#ffffff22}.g{--c:var(--g)}.a{--c:var(--a)}.r{--c:var(--r)}.b{--c:var(--b1)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{text-decoration:none;display:inline-block;border:0;background:none;padding:9px 14px;font-weight:600;color:var(--mut);border-radius:10px 10px 0 0;white-space:nowrap;flex:none}.tab.on{background:var(--card);color:var(--b1);box-shadow:0 -2px 0 var(--b1) inset}
main{padding:0 14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:14px}
input,select,textarea,button{font:inherit;color:inherit}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--b1),var(--b2));cursor:pointer;text-decoration:none;display:inline-block}.btn.o{background:none;color:var(--b1);border:1px solid var(--b1)}.btn.s{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.5}
.mut{color:var(--mut)}.hide{display:none}.msg{padding:9px 12px;border-radius:10px;margin-bottom:10px;background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}.msg.w{background:#fef3c7;color:#78350f}
.back{position:fixed;left:12px;bottom:12px;z-index:6;background:linear-gradient(90deg,var(--b1),var(--b2));color:#fff;border-radius:99px;padding:10px 16px;font-weight:700;font-size:13px;text-decoration:none}
.sel{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
/* ===== the sheet — same layout as the Excel: Arial 10, grey headers, blue band, frozen columns A:B and rows 1–5 ===== */
.xl{font:10px/1.25 Arial,Helvetica,sans-serif;color:#000;background:#fff}
.xs{overflow:auto;max-height:calc(100vh - 210px);border:1px solid #bfbfbf}
.xl table{border-collapse:separate;border-spacing:0;width:max-content;table-layout:fixed}
.xl td,.xl th{border-right:1px solid #bfbfbf;border-bottom:1px solid #bfbfbf;padding:2px 4px;font-weight:400;text-align:left;height:24px;overflow:hidden}
.xl .gy{background:#e7e6e6}.xl .b{font-weight:700}.xl .c{text-align:center}.xl .nb{border:0}
.xl .t1 td{height:76px;text-align:center;font-size:16px;font-weight:700;border:0;position:sticky;top:0;z-index:5;background:#fff}
.xl .t1 td .lg{position:absolute;left:0;top:0;height:76px;display:flex;align-items:center;padding:4px}.xl .t1 td .lg img{max-height:68px;max-width:190px;object-fit:contain}
.xl .t2 td{height:30px;background:#e7e6e6;border:0;position:sticky;top:76px;z-index:5;white-space:nowrap}
.xl .t3 th,.xl .t4 th{background:#e7e6e6;font-weight:700;text-align:center;position:sticky;z-index:4;border-color:#999}.xl .t3 th{top:106px}.xl .t4 th{top:130px}
.xl .band td{background:#174b80;color:#fff;height:23px;font-size:10px;position:sticky;top:154px;z-index:3;white-space:nowrap}
.xl td.fa,.xl th.fa{position:sticky;left:0;z-index:3;background:#fff}.xl td.fb,.xl th.fb{position:sticky;left:40px;z-index:3;background:#fff;box-shadow:1px 0 0 #999}
.xl .t3 th.fa,.xl .t3 th.fb,.xl .t4 th.fa,.xl .t4 th.fb,.xl .t2 td.fa,.xl .t1 td.fa,.xl .band td.fa{z-index:6}
.xl .t3 th.fa,.xl .t3 th.fb,.xl .t4 th.fa,.xl .t4 th.fb{background:#e7e6e6}
.xl tr.ar td{height:37px}.xl td.wrap{white-space:normal;line-height:1.2}
.xl td.d{text-align:center;padding:0;cursor:pointer;user-select:none;width:32px;min-width:32px}.xl td.d.ro{cursor:default}
.xl td.d.C{background:#e2f0d9;color:#375623}.xl td.d.O{background:#fff;color:#174b80}.xl td.d.X{background:#fce4d6;color:#9c0006}.xl td.d.E{background:#fff2cc;color:#7f6000}.xl td.d.N{background:#e7e6e6;color:#808080}
.xl td.d.sel{outline:2px solid #174b80;outline-offset:-2px;position:relative;z-index:2}
.xl td.d.cur{box-shadow:inset 0 -3px 0 #174b80}
.xl tr.tot td{background:#e7e6e6;border:0;height:24px;text-align:center}.xl tr.tot td.l{text-align:left}
.xl .pc{text-align:center}.xl .ok{color:#375623;font-weight:700}.xl .bad{color:#9c0006;font-weight:700}
.xl .sgn td{border:0;height:34px;background:#fff;white-space:nowrap}
.xl input.cell,.xl textarea.cell{font:inherit;border:0;background:transparent;width:100%;padding:0;margin:0;resize:none}
.xl input.cell:focus,.xl textarea.cell:focus{outline:1px solid #174b80;background:#fffbe6}
.pop{position:fixed;z-index:50;background:#fff;border:1px solid #999;box-shadow:0 4px 14px #0004;display:none}.pop.on{display:block}.pop div{padding:5px 18px;cursor:pointer;font:12px Arial}.pop div:hover,.pop div.hi{background:#cfe2f3}.pop b{display:inline-block;width:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--c,var(--b1))}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mut);font-size:12px}
.log table{border-collapse:collapse;width:100%;font:12px Arial}.log th,.log td{border:1px solid #bfbfbf;padding:4px 6px;text-align:left;vertical-align:top}.log th{background:#e7e6e6}.log input{width:100%;padding:3px;border:1px solid #ccc}
.note{font-size:12px;color:var(--mut);margin:6px 0}
/* Review standards + ED reporting — same columns as the Excel */
.xl2{font:11px/1.35 Arial,Helvetica,sans-serif;color:#000;background:#fff;overflow:auto;border:1px solid #bfbfbf}
.xl2 table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:1000px}.xl2 th,.xl2 td{border:1px solid #bfbfbf;padding:5px 7px;vertical-align:top;white-space:pre-wrap}
.xl2 th{background:#174b80;color:#fff;text-align:left;font-weight:700;position:sticky;top:0;z-index:2}.xl2 td.c{text-align:center}
.xl2 h2{margin:0;padding:10px;text-align:center;font-size:16px;background:#fff}.xl2 .nt{padding:3px 8px;border:0;background:#fff;white-space:normal}
.xl2 textarea,.xl2 input,.xl2 select{width:100%;border:0;background:transparent;font:inherit;resize:none;padding:0}.xl2 textarea:focus,.xl2 input:focus,.xl2 select:focus{outline:1px solid #174b80;background:#fffbe6}
.xl2 .rd{display:block;min-height:1.3em}
.xl input.cell.w{color:#fff}.xl input.cell.w::placeholder{color:#cfe0f3}
.xl select.fq{font:10px Arial;border:1px solid #bfbfbf;background:#fff;padding:1px 2px;width:100%}.xl select.fq.un{color:#9c0006;border-color:#e0a0a0}
.xl .wds{display:flex;gap:2px;margin-top:3px}.xl .wds button{font:9px Arial;border:1px solid #bfbfbf;background:#fff;padding:1px 3px;cursor:pointer;min-width:24px}.xl .wds button.on{background:#174b80;color:#fff;border-color:#174b80}
.xl input.dts{font:10px Arial;border:1px solid #bfbfbf;background:#fff;padding:1px 3px;width:100%;margin-top:3px}
.xl td.add{background:#f7f9fc;text-align:left;height:28px}.xl td.add button{font:11px Arial;border:0;background:none;color:#174b80;font-weight:700;cursor:pointer}
.xl td.dl button{border:0;background:none;color:#9c0006;cursor:pointer;font-size:12px}
.dsh .kpi b{font-size:22px}.dsh table{border-collapse:collapse;width:100%;font:12px Arial;margin:6px 0 14px}.dsh th,.dsh td{border:1px solid #d0d7e2;padding:5px 7px;text-align:left;vertical-align:middle}.dsh th{background:#e7e6e6}.dsh td.n,.dsh th.n{text-align:right}
.dsh h3{margin:16px 0 4px;font-size:15px}.dsh .bar2{height:10px;border-radius:5px;background:#e5e9f2;overflow:hidden;min-width:90px}.dsh .bar2 i{display:block;height:100%}
.dsh .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}.dsh .box{border:1px solid var(--line);border-radius:12px;padding:12px}
.emp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.emp input:not([type=checkbox]){padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:150px}.emp input[type=number]{min-width:0}.emp label{display:inline-flex;gap:4px;align-items:center}.emp input[type=checkbox]{width:auto;min-width:0;margin:0}
.xl .wdoff{font:11px Arial}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff;padding:0}header,.tabs,.noprint,.back,.pop,#msg,footer{display:none!important}main{padding:0}.panel{border:0;padding:0}.xs{max-height:none;overflow:visible;border:0}.xl td.fa,.xl th.fa,.xl td.fb,.xl th.fb,.xl .t1 td,.xl .t2 td,.xl .t3 th,.xl .t4 th,.xl .band td{position:static}.xl{zoom:.5}.xl2{zoom:.7;overflow:visible}.xl2 th{position:static}.xl td.d.sel{outline:0}}
</style></head><body>
<header><span class="clogo" id="clogo" hidden></span><div><h1>Daily Work Management</h1><small id="co">Loading…</small></div><div style="flex:1"></div><span class="chip x" id="role"></span></header>
<div class="tabs"><a class="tab on" data-t="std" href="#go=std">Standards alignment</a><a class="tab" data-t="sheet" href="#go=sheet">DWM</a><a class="tab" data-t="dash" href="#go=dash">Dashboards</a></div>
<main><div class="panel"><div id="msg"></div>
<section id="std"></section><section id="sheet" class="hide"></section><section id="dash" class="hide"></section></div></main>
<div class="pop" id="pop"></div>
<script src="/it/kmr-lock.js"></script><script src="/it/apps/qp-core.js"></script><script src="/it/apps/tsk-assign.js"></script><script src="/it/apps/dwm-core.js"></script><script src="/it/apps/dwm-app.js"></script><script src="/it/apps/back.js"></script><script src="/it/apps/kmr-present-link.js"></script></body></html>
